[package]
name = "codecrafters-claude-code"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2024"
rust-version = "1.95"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }  # async runtime
async-openai = { version = "=0.41.1", features = ["byot", "chat-completion", "chat-completion-types"] }
clap = { version = "4.3.14", features = ["derive"] }                 # CLI argument parsing
serde_json = "1.0.149"                                                # JSON serialization/deserialization
dotenvy = "0.15.7"
thiserror = "2.0.19"